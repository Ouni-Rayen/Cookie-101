{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="card narrow">
    <div class="tabs">
        <a href="?mode=login" class="tab {% if mode != 'register' %}active{% endif %}">Login</a>
        <a href="?mode=register" class="tab {% if mode == 'register' %}active{% endif %}">Register</a>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% if mode == 'register' %}
    <form method="POST">
        <input type="hidden" name="action" value="register">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="Choose a username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Choose a password">

        <button type="submit" class="btn">Create account</button>
    </form>
    {% else %}
    <form method="POST">
        <input type="hidden" name="action" value="login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="Your username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Your password">

        <button type="submit" class="btn">Sign in</button>
    </form>
    {% endif %}
</section>
{% endblock %}
